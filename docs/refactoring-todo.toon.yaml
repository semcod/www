# ═══════════════════════════════════════════════════════════════
# PHASE 5 — QUALITY GATES (effort: 4h, risk: none)
# goal: prevent regressions, enforce budgets
# ═══════════════════════════════════════════════════════════════

PHASE[5] quality_gates:
  status: not_started
  effort: 4h
  risk: none
  done_when:
    - pre-commit hook installed and active
    - CI gate blocks CC regression > 0.2
    - no new file > 400L can be committed

  TASK[5.1] install_quality_gate_www:
    project: www
    action: configure
    steps:
      - install pre-commit hook via redsl gate --install-hook
      - add CI step: python -m redsl.autonomy.quality_gate .
    rules:
      - new_file_max_lines: 400
      - new_function_max_cc: 12
      - cc_mean_delta_max: 0.2
      - critical_count_delta_max: 0

  TASK[5.2] install_quality_gate_redsl:
    project: redsl
    action: configure
    rules:
      - new_file_max_lines: 400
      - new_function_max_cc: 12
      - cc_mean_delta_max: 0.2
      - growth_budget_loc_per_week: 2000

  TASK[5.3] install_growth_controller:
    project: redsl
    action: configure
    rules:
      - max_new_lines_per_commit: 300
      - max_new_files_per_commit: 5
      - require_test_for_new_module: true
      - max_total_growth_per_week: 2000

# ═══════════════════════════════════════════════════════════════
# PHASE 6 — PRODUCT FEATURES (effort: 20h, risk: medium)
# goal: scan diff, auto-PR, billing, scheduled scans
# ═══════════════════════════════════════════════════════════════

PHASE[6] product_features:
  status: not_started
  effort: 20h
  risk: medium
  depends_on: [PHASE[1], PHASE[2]]
  done_when:
    - scan diff API returns delta vs previous
    - auto-PR creates branch + PR on GitHub
    - Stripe checkout works
    - scheduled scans run on cron

  TASK[6.1] scan_diff_api:
    project: www
    action: new_feature
    endpoint: "POST /api/scan/{owner}/{repo}"
    output:
      delta: { score_change, new_issues, fixed_issues, regressions }
      proposals: [{ type, target, reason, effort, impact, auto_fixable, llm_prompt }]
    depends_on: [database.py has scan history]
    done_when:
      - delta calculated against last scan for same repo
      - proposals ranked by impact score
      - response includes llm_prompt for auto-fixable items

  TASK[6.2] auto_pr_generation:
    project: www
    action: new_feature
    flow:
      - proposal with auto_fixable=true
      - LLM generates patch using llm_prompt
      - git checkout -b feat/semcod-fix-{id}
      - apply patch
      - run tests + scan (validate improvement)
      - PASS → create PR via GitHub API
      - FAIL → rollback + create issue instead
    done_when:
      - at least one auto-PR successfully created
      - PR includes: before/after metrics, diff preview
      - rollback works on validation failure

  TASK[6.3] stripe_billing:
    project: www
    action: new_feature
    files: [routers/billing.py, models/subscription.py]
    plans:
      free: { scans_per_week: 3, price: 0 }
      pro: { scans_per_week: -1, price_monthly: 9, price_annual: 81 }
      team: { scans_per_week: -1, price_monthly: 29 }
    done_when:
      - Stripe checkout session creates subscription
      - webhook handles: checkout.completed, subscription.updated, subscription.deleted
      - billing status API returns current plan + limits

  TASK[6.4] scheduled_scans:
    project: www
    action: new_feature
    files: [scheduler/cron.py, scheduler/scan_job.py, models/scan_schedule.py]
    done_when:
      - APScheduler checks due scans every 60s
      - scan executes: clone → analyze → save → detect degradation
      - degradation alert sent to webhook (Slack/Discord)

  TASK[6.5] paywall_component:
    project: www
    action: new_feature
    trigger: scans_this_week >= plan.scans_per_week
    done_when:
      - modal shows after limit hit
      - two plan options (monthly/annual)
      - redirect to Stripe checkout

  TASK[6.6] trend_api:
    project: www
    action: new_feature
    endpoints:
      - "GET /api/trend/{owner}/{repo}?days=30"
      - "GET /api/trend/{owner}/{repo}/compare"
    done_when:
      - returns historical health scores with dates
      - summary includes: trend direction, delta, best, worst

# ═══════════════════════════════════════════════════════════════
# PHASE 7 — MANAGED INFRA (effort: 40h, risk: high)
# goal: ticket-to-deploy pipeline on semcod infrastructure
# ═══════════════════════════════════════════════════════════════

PHASE[7] managed_infrastructure:
  status: not_started
  effort: 40h
  risk: high
  depends_on: [PHASE[6]]
  done_when:
    - sandbox runner isolates each scan in Docker
    - CI/CD auto-detects stack and generates pipeline
    - ticket → LLM implementation → PR → deploy works end-to-end
    - 1-month free trial flow works

  TASK[7.1] sandbox_runner:
    action: Docker container per scan with resource limits
    done_when: scan runs in isolated container, cleanup on completion

  TASK[7.2] ci_cd_pipeline_builder:
    action: auto-detect stack (Python/Node/Go) → generate build+test pipeline
    done_when: at least Python and Node stacks auto-detected and built

  TASK[7.3] ticket_to_pr:
    action: accept ticket input → classify → plan → LLM implement → PR
    done_when: one pilot flow works from ticket to merged PR

  TASK[7.4] deploy_staging_prod:
    action: Docker → managed k8s/Railway/Fly.io
    done_when: staging deploy from PR merge, manual promote to prod

# ═══════════════════════════════════════════════════════════════
# PHASE 8 — MARKETPLACE (effort: 40h, risk: high)
# goal: publish + browse + buy artifacts with revenue share
# ═══════════════════════════════════════════════════════════════

PHASE[8] marketplace:
  status: not_started
  effort: 40h
  risk: high
  depends_on: [PHASE[7]]
  done_when:
    - developer can publish artifact (SaaS/Desktop/Mobile/API)
    - buyer can browse + subscribe
    - Stripe Connect handles revenue share (70-85% developer)
    - at least one artifact deployed and purchasable

  TASK[8.1] marketplace_api:
    endpoints:
      - "POST /api/marketplace/publish"
      - "GET /api/marketplace/browse"
      - "POST /api/marketplace/products/{id}/subscribe"
    done_when: CRUD works, search by category

  TASK[8.2] stripe_connect:
    action: Stripe Connect for developer payouts
    revenue_share: { developer: "70-85%", semcod: "15-30%" }
    done_when: test payout to connected account succeeds

  TASK[8.3] artifact_builder:
    types: [saas, desktop, api]
    action: Docker build → deploy per artifact type
    done_when: at least SaaS type works end-to-end

  TASK[8.4] marketplace_landing:
    action: browse page with: health badge, pricing, reviews, install button
    done_when: public page renders with real data

