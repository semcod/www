# docker-compose.gitea.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.gitea.yml up -d
#
# Replaces mock-github with a REAL Gitea instance for full developer cycle testing:
#   OAuth login → repo list → audit → PR creation → webhook → PR comment bot
#
# Gitea UI:  http://localhost:3100
# Gitea API: http://localhost:3100/api/v1
# After startup run: bash scripts/setup-gitea.sh

services:
  gitea:
    image: gitea/gitea:1.22-rootless
    ports:
      - "3100:3000"
      - "2222:2222"
    environment:
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__server__ROOT_URL=http://localhost:3100
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__DOMAIN=localhost
      - GITEA__server__SSH_DOMAIN=localhost
      - GITEA__server__SSH_PORT=2222
      - GITEA__server__DISABLE_REGISTRATION=false
      - GITEA__service__REQUIRE_SIGNIN_VIEW=false
      - GITEA__service__DISABLE_REGISTRATION=false
      - GITEA__oauth2__ENABLE=true
      - GITEA__webhook__ALLOWED_HOST_LIST=backend,host.docker.internal,172.0.0.0/8,10.0.0.0/8,192.168.0.0/16
      - GITEA__api__ENABLE_SWAGGER=true
    volumes:
      - gitea_data:/var/lib/gitea
      - gitea_config:/etc/gitea
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/v1/version"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  backend:
    environment:
      # Point OAuth + API to local Gitea
      - GITEA_URL=http://gitea:3000
      - GITEA_API_BASE_URL=http://gitea:3000
      - GITEA_OAUTH_AUTHORIZE_URL=http://localhost:3100/login/oauth/authorize
      - GITEA_OAUTH_TOKEN_URL=http://gitea:3000/login/oauth/access_token
      - GITEA_CLIENT_ID=${GITEA_CLIENT_ID:-}
      - GITEA_CLIENT_SECRET=${GITEA_CLIENT_SECRET:-}
      - GITEA_WEBHOOK_SECRET=${GITEA_WEBHOOK_SECRET:-semcod-webhook-secret}
      - GITEA_ADMIN_TOKEN=${GITEA_ADMIN_TOKEN:-}
      # Default provider for dev
      - DEFAULT_GIT_PROVIDER=gitea
      - FRONTEND_URL=http://localhost:3000
      - APP_URL=http://localhost:8003
    depends_on:
      gitea:
        condition: service_healthy

volumes:
  gitea_data:
  gitea_config:
