# Local dev override: Traefik HTTPS reverse proxy + demo mode
# Usage: docker compose up
#
# App available at: https://semcod.localhost or http://nvidia:3000 (LAN)

services:
  traefik:
    image: traefik:v3.3
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /tmp/traefik-certs:/etc/traefik/certs:ro
    labels:
      - "traefik.enable=true"

  backend:
    environment:
      - APP_URL=http://localhost:8003
      - FRONTEND_URL=http://localhost:3000
      - CORS_ORIGINS=http://localhost:3000,http://nvidia:3000,https://semcod.localhost,https://semcod.com
      - DEMO_MODE=1
      - SECRET_KEY=dev-secret-change-me
      - GITHUB_OAUTH_AUTHORIZE_URL=http://localhost:4010/login/oauth/authorize
      - GITHUB_OAUTH_TOKEN_URL=http://mock-github:4010/login/oauth/access_token
      - GITHUB_API_BASE_URL=http://mock-github:4010
      - GITHUB_CLIENT_ID=${MOCK_GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${MOCK_GITHUB_CLIENT_SECRET}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=PathPrefix(`/api/`) || PathPrefix(`/auth/`) || PathPrefix(`/webhook/`) || PathPrefix(`/badge/`) || PathPrefix(`/report/`) || PathPrefix(`/mcp/`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
    ports:
      - "0.0.0.0:8003:8000"

  frontend:
    environment:
      - VITE_PUBLIC_URL=http://nvidia:3000
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    ports:
      - "0.0.0.0:3000:3000"
