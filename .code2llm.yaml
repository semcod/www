# code2llm configuration for semcod/www
# This file configures the code2llm analyzer to ignore inline styles
# which artificially inflate cyclomatic complexity (CC) metrics.

analysis:
  # Exclude inline style objects from CC calculation
  # Style objects like: style={{ color: C.fg, fontSize: 14 }} are data, not logic
  exclude_patterns:
    - "style\\s*=\\s*\\{\\{"
    - "style={{"
    - "sx={{"
    - "css={{"
  
  # Ignore CSS-in-JS pattern lines for complexity
  jsx_style_patterns:
    - "^\\s*style\\s*="
    - "^\\s*[a-z]+Style\\s*="
    - "^\\s*containerStyle\\s*="
    - "^\\s*buttonStyle\\s*="
  
  # Per-file overrides for known false positives
  file_overrides:
    - pattern: "ResultHeader.jsx"
      max_cc: 10  # Actual logic CC, not style-inflated
    - pattern: "ResultPhase.jsx"
      max_cc: 10
    - pattern: "LandingPhase.jsx"
      max_cc: 8

output:
  # Generate TOON format with corrected CC metrics
  formats:
    - toon
    - map
    - evolution
    - context
  
  # Exclude node_modules and generated files
  exclude:
    - "**/node_modules/**"
    - "**/.venv/**"
    - "**/venv/**"
    - "**/dist/**"
    - "**/build/**"
    - "**/*.spec.js"
    - "**/*.test.js"
    - "**/e2e/**"

metrics:
  # Adjust CC calculation for React components with heavy styling
  jsx_component_multiplier: 0.3  # Reduce CC weight for JSX style objects
  
  # Consider these as non-branching code patterns
  ignore_branches_for:
    - "style objects"
    - "inline CSS"
    - "theme variables"
