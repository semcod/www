server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Docs first (exact match with priority)
    location /docs {
        alias /usr/share/nginx/html/docs;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Main app - must be last
    location / {
        try_files $uri $uri/ /index.html;
    }
}
