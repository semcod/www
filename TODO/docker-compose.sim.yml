# docker-compose.sim.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.sim.yml up -d
#
# This adds a mock GitHub OAuth server and overrides backend env vars
# so the OAuth flow goes through the simulator instead of real GitHub.

version: "3.9"

services:
  mock-github:
    build:
      context: ./mock-github
      dockerfile: Dockerfile
    ports:
      - "4010:4010"
    environment:
      - FRONTEND_URL=http://frontend:3000
      - BACKEND_URL=http://backend:8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4010/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    environment:
      # Override GitHub OAuth URLs → point to mock server
      - GITHUB_OAUTH_AUTHORIZE_URL=http://mock-github:4010/login/oauth/authorize
      - GITHUB_OAUTH_TOKEN_URL=http://mock-github:4010/login/oauth/access_token
      - GITHUB_API_BASE_URL=http://mock-github:4010
      # Dummy credentials (mock server accepts anything)
      - GITHUB_CLIENT_ID=Iv1.mock_test_client
      - GITHUB_CLIENT_SECRET=mock_secret_for_testing
      - GITHUB_APP_ID=999999
      - GITHUB_WEBHOOK_SECRET=whsec_mock_test
      # Frontend URL for redirects
      - FRONTEND_URL=http://localhost:3000
      - APP_URL=http://localhost:8003
    depends_on:
      mock-github:
        condition: service_healthy
