name: Deploy

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: |
          docker build -t ${{ github.repository }}:${{ github.sha }} .
          docker tag ${{ github.repository }}:${{ github.sha }} ${{ github.repository }}:latest

      - name: Login to registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Login to container registry here"
          # docker login -u ${{ secrets.REGISTRY_USER }} -p ${{ secrets.REGISTRY_PASSWORD }} registry.example.com

      - name: Push to registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Push image to registry here"
          # docker push ${{ github.repository }}:${{ github.sha }}
          # docker push ${{ github.repository }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to production
        run: |
          echo "Deploy application to production"
          # Add deployment commands here
          # kubectl apply -f k8s/
          # helm upgrade --install app ./helm/
          # or other deployment method

      - name: Health check
        run: |
          echo "Run health check after deployment"
          # curl -f http://your-app/health || exit 1

  notify:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always()
    steps:
      - name: Send notification
        if: failure()
        run: |
          echo "Send failure notification"
          # Send webhook, Slack notification, etc.
