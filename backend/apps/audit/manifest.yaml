name: audit
version: 1.0.0
description: Code quality audit - complexity, duplication, health score

triggers:
  - pull_request
  - push

actions:
  - comment
  - badge
  - status_check

permissions:
  - repo:read
  - checks:write

config:
  enabled_repos: []
  max_complexity: 15
  max_duplication: 5
  min_health_score: 70

pricing:
  tier: free
  limits:
    free:
      repos: 1
      scans_per_month: 100
    pro:
      repos: unlimited
      scans_per_month: unlimited
