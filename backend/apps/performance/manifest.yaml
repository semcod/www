name: performance
description: Performance analysis - slow queries, memory leaks, bottlenecks
version: 1.0.0

triggers:
  - pull_request
  - push

actions:
  - comment
  - badge
  - status_check

permissions:
  - repo:read

config:
  enabled_repos: []
  max_query_time_ms: 100
  max_memory_mb: 512

pricing:
  tier: pro
  limits:
    pro:
      repos: unlimited
      scans_per_month: unlimited
