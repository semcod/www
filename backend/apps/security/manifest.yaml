name: security
version: 1.0.0
description: Security vulnerability scanning - secrets, CVEs, best practices

triggers:
  - pull_request
  - push

actions:
  - comment
  - create_pr
  - status_check
  - label

permissions:
  - repo:read
  - security_events:write

config:
  enabled_repos: []
  block_on_critical: true
  scan_secrets: true
  scan_dependencies: true

pricing:
  tier: pro
  limits:
    free:
      repos: 0
      scans_per_month: 0
    pro:
      repos: unlimited
      scans_per_month: unlimited
