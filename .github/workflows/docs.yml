name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build Documentation Site
        run: |
          mkdir -p _site
          # Copy all docs files
          cp -r docs/* _site/
          # Create index.html from README.md
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Semcod Documentation</title>
              <style>
                  :root {
                      --bg-color: #0d1117;
                      --text-color: #c9d1d9;
                      --link-color: #58a6ff;
                      --border-color: #30363d;
                      --header-bg: #161b22;
                  }
                  * { box-sizing: border-box; }
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                      background: var(--bg-color);
                      color: var(--text-color);
                      line-height: 1.6;
                      margin: 0;
                      padding: 0;
                  }
                  header {
                      background: var(--header-bg);
                      border-bottom: 1px solid var(--border-color);
                      padding: 1rem 2rem;
                  }
                  header h1 {
                      margin: 0;
                      font-size: 1.5rem;
                  }
                  header a {
                      color: var(--link-color);
                      text-decoration: none;
                  }
                  nav {
                      background: var(--header-bg);
                      border-right: 1px solid var(--border-color);
                      width: 250px;
                      position: fixed;
                      height: 100vh;
                      overflow-y: auto;
                      padding: 1rem;
                  }
                  nav ul {
                      list-style: none;
                      padding: 0;
                      margin: 0;
                  }
                  nav li {
                      margin: 0.5rem 0;
                  }
                  nav a {
                      color: var(--text-color);
                      text-decoration: none;
                      display: block;
                      padding: 0.5rem;
                      border-radius: 4px;
                  }
                  nav a:hover {
                      background: var(--border-color);
                  }
                  main {
                      margin-left: 250px;
                      padding: 2rem;
                      max-width: 900px;
                  }
                  a { color: var(--link-color); }
                  code {
                      background: var(--header-bg);
                      padding: 0.2rem 0.4rem;
                      border-radius: 3px;
                      font-family: 'SF Mono', Monaco, monospace;
                  }
                  pre {
                      background: var(--header-bg);
                      padding: 1rem;
                      border-radius: 6px;
                      overflow-x: auto;
                  }
                  pre code {
                      background: transparent;
                      padding: 0;
                  }
                  table {
                      width: 100%;
                      border-collapse: collapse;
                      margin: 1rem 0;
                  }
                  th, td {
                      border: 1px solid var(--border-color);
                      padding: 0.5rem;
                      text-align: left;
                  }
                  th {
                      background: var(--header-bg);
                  }
                  @media (max-width: 768px) {
                      nav {
                          width: 100%;
                          position: relative;
                          height: auto;
                      }
                      main {
                          margin-left: 0;
                      }
                  }
              </style>
          </head>
          <body>
              <header>
                  <h1><a href="https://github.com/semcod/www">Semcod</a> Documentation</h1>
              </header>
              <nav>
                  <ul>
                      <li><a href="README.md">Overview</a></li>
                      <li><a href="getting-started.md">Getting Started</a></li>
                      <li><a href="api.md">API Reference</a></li>
                      <li><a href="architecture.md">Architecture</a></li>
                      <li><a href="MCP.md">MCP Integration</a></li>
                  </ul>
              </nav>
              <main>
          EOF
          # Convert markdown links to HTML
          cat docs/README.md | sed 's/\.md)/.html)/g' | sed 's/(\([^)]*\)\.md/(\1.html/g' >> _site/index.html
          cat >> _site/index.html << 'EOF'
              </main>
          </body>
          </html>
          EOF
          # Create HTML versions of other docs
          for file in docs/*.md; do
              if [ "$(basename $file)" != "README.md" ]; then
                  name=$(basename $file .md)
                  cat > _site/${name}.html << EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>${name} - Semcod Docs</title>
              <style>
                  :root {
                      --bg-color: #0d1117;
                      --text-color: #c9d1d9;
                      --link-color: #58a6ff;
                      --border-color: #30363d;
                      --header-bg: #161b22;
                  }
                  * { box-sizing: border-box; }
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                      background: var(--bg-color);
                      color: var(--text-color);
                      line-height: 1.6;
                      margin: 0;
                      padding: 0;
                  }
                  header {
                      background: var(--header-bg);
                      border-bottom: 1px solid var(--border-color);
                      padding: 1rem 2rem;
                  }
                  header h1 {
                      margin: 0;
                      font-size: 1.5rem;
                  }
                  header a {
                      color: var(--link-color);
                      text-decoration: none;
                  }
                  nav {
                      background: var(--header-bg);
                      border-right: 1px solid var(--border-color);
                      width: 250px;
                      position: fixed;
                      height: 100vh;
                      overflow-y: auto;
                      padding: 1rem;
                  }
                  nav ul {
                      list-style: none;
                      padding: 0;
                      margin: 0;
                  }
                  nav li {
                      margin: 0.5rem 0;
                  }
                  nav a {
                      color: var(--text-color);
                      text-decoration: none;
                      display: block;
                      padding: 0.5rem;
                      border-radius: 4px;
                  }
                  nav a:hover, nav a.active {
                      background: var(--border-color);
                  }
                  main {
                      margin-left: 250px;
                      padding: 2rem;
                      max-width: 900px;
                  }
                  a { color: var(--link-color); }
                  code {
                      background: var(--header-bg);
                      padding: 0.2rem 0.4rem;
                      border-radius: 3px;
                      font-family: 'SF Mono', Monaco, monospace;
                  }
                  pre {
                      background: var(--header-bg);
                      padding: 1rem;
                      border-radius: 6px;
                      overflow-x: auto;
                  }
                  pre code {
                      background: transparent;
                      padding: 0;
                  }
                  table {
                      width: 100%;
                      border-collapse: collapse;
                      margin: 1rem 0;
                  }
                  th, td {
                      border: 1px solid var(--border-color);
                      padding: 0.5rem;
                      text-align: left;
                  }
                  th {
                      background: var(--header-bg);
                  }
                  @media (max-width: 768px) {
                      nav {
                          width: 100%;
                          position: relative;
                          height: auto;
                      }
                      main {
                          margin-left: 0;
                      }
                  }
              </style>
          </head>
          <body>
              <header>
                  <h1><a href="https://github.com/semcod/www">Semcod</a> Documentation</h1>
              </header>
              <nav>
                  <ul>
                      <li><a href="index.html">Overview</a></li>
                      <li><a href="getting-started.html">Getting Started</a></li>
                      <li><a href="api.html">API Reference</a></li>
                      <li><a href="architecture.html">Architecture</a></li>
                      <li><a href="MCP.html">MCP Integration</a></li>
                  </ul>
              </nav>
              <main>
          EOF
                  cat $file | sed 's/\.md)/.html)/g' | sed 's/(\([^)]*\)\.md/(\1.html/g' >> _site/${name}.html
                  cat >> _site/${name}.html << 'EOF'
              </main>
          </body>
          </html>
          EOF
              fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
