name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run quality gate
        run: |
          python backend/quality_gate.py --baseline .quality-baseline.json

  backend-tests:
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Run backend tests
        run: |
          cd backend
          python -m pytest tests ../tests/backend -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Build frontend
        run: cd frontend && npm run build

  frontend-e2e:
    runs-on: ubuntu-latest
    needs: frontend-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Start backend (DEMO_MODE=1)
        run: |
          cd backend
          DEMO_MODE=1 PORT=9000 uvicorn server:app --host 127.0.0.1 --port 9000 &
          sleep 3
          curl -s http://127.0.0.1:9000/api/health || exit 1
      - name: Start frontend dev server
        run: |
          cd frontend
          npm run dev -- --port 5173 &
          sleep 5
          curl -s http://localhost:5173 | grep -q "Semcod" || true
      - name: Run frontend E2E tests
        run: cd frontend && npx playwright test --config=playwright.config.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-e2e-report
          path: frontend/playwright-report/

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Install E2E dependencies
        run: cd e2e && npm ci
      - name: Install Playwright browsers
        run: cd e2e && npx playwright install --with-deps chromium
      - name: Start backend (DEMO_MODE=1)
        run: |
          cd backend
          DEMO_MODE=1 PORT=9000 uvicorn server:app --host 127.0.0.1 --port 9000 &
          sleep 3
          curl -s http://127.0.0.1:9000/api/health || exit 1
      - name: Run E2E tests
        run: cd e2e && npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
