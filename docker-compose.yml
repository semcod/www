version: "3.9"

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: semcod
      POSTGRES_USER: semcod
      POSTGRES_PASSWORD: semcod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:8003:8000"
    env_file:
      - .env
    environment:
      - GITHUB_PRIVATE_KEY_PATH=/app/private-key.pem
      - APP_URL=http://nvidia:8003
      - FRONTEND_URL=http://nvidia:3000
      - CORS_ORIGINS=http://nvidia:3000,https://semcod.com
      - DATABASE_URL=postgresql://semcod:semcod@db:5432/semcod
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./private-key.pem:/app/private-key.pem:ro
    depends_on:
      - db
      - redis
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A worker worker --loglevel=info
    env_file:
      - .env
    environment:
      - GITHUB_PRIVATE_KEY_PATH=/app/private-key.pem
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://semcod:semcod@db:5432/semcod
    volumes:
      - ./private-key.pem:/app/private-key.pem:ro
    depends_on:
      - db
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "celery", "-A", "worker", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      - VITE_PUBLIC_URL=http://nvidia:3000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
