version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:8003:8000"
    env_file:
      - .env
    environment:
      - GITHUB_PRIVATE_KEY_PATH=/app/private-key.pem
      - APP_URL=http://nvidia:8003
      - FRONTEND_URL=http://nvidia:3000
      - CORS_ORIGINS=http://nvidia:3000,https://semcod.com
    volumes:
      - ./private-key.pem:/app/private-key.pem:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      - VITE_PUBLIC_URL=http://nvidia:3000
    depends_on:
      - backend
    restart: unless-stopped
