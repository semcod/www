services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: semcod
      POSTGRES_USER: semcod
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-semcod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U semcod"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:8003:8000"
    env_file:
      - .env
    environment:
      - GITHUB_PRIVATE_KEY_PATH=/app/private-key.pem
      - APP_URL=http://nvidia:8003
      - FRONTEND_URL=http://nvidia:3000
      - CORS_ORIGINS=http://nvidia:3000,https://semcod.com
      - DATABASE_URL=postgresql://semcod:semcod@db:5432/semcod
      - REDIS_URL=redis://redis:6379/0
      - REDLS_URL=http://redsl:8000
    volumes:
      - ./private-key.pem:/app/private-key.pem:ro
      - /tmp/local-git-repos:/local-repos:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A worker worker --loglevel=info
    env_file:
      - .env
    environment:
      - GITHUB_PRIVATE_KEY_PATH=/app/private-key.pem
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://semcod:semcod@db:5432/semcod
      - REDLS_URL=http://redsl:8000
    volumes:
      - ./private-key.pem:/app/private-key.pem:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "celery", "-A", "worker", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  redsl:
    build: ../redsl
    ports:
      - "0.0.0.0:8030:8000"
    env_file:
      - .env
    environment:
      - REFACTOR_DRY_RUN=false
      - REFACTOR_AUTO_APPROVE=false
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    volumes:
      - /tmp/local-git-repos:/mnt/project:ro
      - redsl_memory:/tmp/redsl_memory
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  redsl_memory:
